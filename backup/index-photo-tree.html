<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bongweb: AI-built, human-checked studio</title>
  <meta name="description" content="Websites, apps, automations, brand, content and growth for small businesses. Built fast with AI, checked by a person, delivered on the date we promise.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <header class="site-header">
    <div class="wrap header-row">
      <a href="#top" class="wordmark" aria-label="Bongweb home">bongweb</a>
      <a class="btn btn-wa btn-sm js-wa header-cta" data-msg="Hi Bongweb, I'd like to talk about a project." href="#grow">
        <svg class="wa-icon" viewBox="0 0 24 24" aria-hidden="true"><use href="#wa"/></svg>
        <span>WhatsApp us</span>
      </a>
    </div>
  </header>

  <main id="top">
    <!-- The whole landing page: a tree that grows as you scroll -->
    <section id="grow" class="grow" aria-label="How Bongweb grows your business">
      <div class="grow-stage">
        <canvas class="grow-canvas" aria-hidden="true"></canvas>
        <div class="grow-world"></div>

        <p class="grow-hint" aria-hidden="true">Scroll to grow</p>
      </div>
    </section>
  </main>

  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="wa" viewBox="0 0 24 24"><path fill="currentColor" d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2Zm0 18.2a8.2 8.2 0 0 1-4.2-1.1l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.2Zm4.5-6.1c-.2-.1-1.5-.7-1.7-.8-.2-.1-.4-.1-.6.1l-.8 1c-.1.2-.3.2-.5.1a6.7 6.7 0 0 1-3.3-2.9c-.3-.4.3-.4.7-1.4.1-.2 0-.3 0-.4l-.8-1.8c-.2-.5-.4-.4-.6-.4h-.5a1 1 0 0 0-.7.3 3 3 0 0 0-.9 2.2 5.2 5.2 0 0 0 1.1 2.7 11.8 11.8 0 0 0 4.5 4c1.7.7 2.3.8 3.2.6.5-.1 1.5-.6 1.7-1.2.2-.6.2-1.1.2-1.2-.1-.1-.3-.2-.5-.3Z"/></symbol>
  </svg>

  <script src="data/services.js"></script>
  <script src="data/scene.js"></script>
  <script src="script.js"></script>
  <script src="grow.js"></script>
</body>
</html>
